name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: "linux"
          GOARCH: "${{ matrix.goarch }}"
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o dist/tomovee ./cmd/tomovee

      - name: Check binary architecture
        run: file dist/tomovee

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomovee-${{ matrix.goarch }}
          path: dist/tomovee