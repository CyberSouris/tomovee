name: coverage
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: internal/webui/package-lock.json
    - name: Install frontend dependencies
      working-directory: internal/webui
      run: npm ci
    - name: Install Cypress binary
      working-directory: internal/webui
      run: npx --no-install cypress install
    # The real-binary smoke specs scan the committed testdata/media fixtures,
    # which the daemon can only read with ffprobe on PATH.
    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - name: Generate coverage report (unit tests + real-binary e2e specs)
      run: make coverage
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: coverage.out
        fail_ci_if_error: true