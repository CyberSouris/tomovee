name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release (e.g. v0.2.0). Creates an annotated tag and publishes the release."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          tag="${tag#v}"
          echo "tag=${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build documentation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends asciidoctor
          mkdir -p dist/docs/html
          asciidoctor -b html5 docs/tomovee.adoc -o dist/docs/html/usage.html
          asciidoctor -b html5 docs/api.adoc -o dist/docs/html/api.html
          cp docs/tomovee.adoc docs/api.adoc dist/docs/

      - name: Build binary
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.tag }}" \
            -o dist/tomovee ./cmd/tomovee

      - name: Stage tarball
        run: |
          tag="${{ steps.version.outputs.tag }}"
          dir="tomovee-${tag}-linux-${{ matrix.goarch }}"
          mkdir -p "dist/pkg/${dir}"
          cp dist/tomovee "dist/pkg/${dir}/tomovee"
          cp -r dist/docs "dist/pkg/${dir}/docs"
          cp README.md SPEC.md config.example.yaml "dist/pkg/${dir}/"
          tar -C dist/pkg -czf "dist/${dir}.tar.gz" "${dir}"
          sha256sum "dist/${dir}.tar.gz" \
            > "dist/SHA256SUMS-${{ matrix.goarch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomovee-${{ matrix.goarch }}
          path: |
            dist/tomovee-*.linux-*.tar.gz
            dist/SHA256SUMS-*
          if-no-files-found: error

  release:
    name: Prepare changelog, source tarball, tag and publish
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          tag="${tag#v}"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Combine checksums
        run: cat release/SHA256SUMS-* > release/SHA256SUMS

      - name: Generate changelog
        run: |
          tag="${{ steps.version.outputs.version }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          else
            prev="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          fi
          {
            echo "# Changelog"
            echo
            echo "## ${tag} — $(date -u +%Y-%m-%d)"
            echo
            echo "Built from \`${{ steps.version.outputs.sha }}\`. Artifacts: linux/amd64, linux/arm64, linux/riscv64 binaries and a source tarball."
            echo
          } > CHANGELOG.md
          if [ -n "$prev" ]; then
            git log --no-merges --format='%s' "${prev}..HEAD"
          else
            git log --no-merges --format='%s' HEAD
          fi | awk '
            /^feat(\([^)]*\))?:[ \t]*/ {
              sub(/^feat(\([^)]*\))?:[ \t]*/, "");
              f[++nf]=$0; next
            }
            /^fix(\([^)]*\))?:[ \t]*/ {
              sub(/^fix(\([^)]*\))?:[ \t]*/, "");
              x[++nx]=$0; next
            }
            /^perf(\([^)]*\))?:[ \t]*/ {
              sub(/^perf(\([^)]*\))?:[ \t]*/, "");
              p[++np]=$0; next
            }
            /^refactor(\([^)]*\))?:[ \t]*/ {
              sub(/^refactor(\([^)]*\))?:[ \t]*/, "");
              r[++nr]=$0; next
            }
            /^docs(\([^)]*\))?:[ \t]*/ {
              sub(/^docs(\([^)]*\))?:[ \t]*/, "");
              d[++nd]=$0; next
            }
            /^ci(\([^)]*\))?:[ \t]*/ {
              sub(/^ci(\([^)]*\))?:[ \t]*/, "");
              c[++nc]=$0; next
            }
            { o[++no]=$0 }
            END {
              if (nf>0) { print "### Features"; for(i=1;i<=nf;i++) print "- " f[i]; print "" }
              if (nx>0) { print "### Bug fixes"; for(i=1;i<=nx;i++) print "- " x[i]; print "" }
              if (np>0) { print "### Performance"; for(i=1;i<=np;i++) print "- " p[i]; print "" }
              if (nr>0) { print "### Refactoring"; for(i=1;i<=nr;i++) print "- " r[i]; print "" }
              if (nd>0) { print "### Documentation"; for(i=1;i<=nd;i++) print "- " d[i]; print "" }
              if (nc>0) { print "### CI & tooling"; for(i=1;i<=nc;i++) print "- " c[i]; print "" }
              if (no>0) { print "### Other"; for(i=1;i<=no;i++) print "- " o[i]; print "" }
              if (nf+nx+np+nr+nd+nc+no==0) print "- No changes"
            }
          ' >> CHANGELOG.md
          {
            echo "# tomovee ${{ steps.version.outputs.version }}"
            echo
            cat CHANGELOG.md
          } > release-notes.md

      - name: Stage source tarball
        run: |
          version="${{ steps.version.outputs.version }}"
          dir="tomovee-${version}-src"
          mkdir -p "src-pkg/${dir}"
          git archive --format=tar HEAD | tar -x -C "src-pkg/${dir}"
          cp CHANGELOG.md "src-pkg/${dir}/CHANGELOG.md"
          echo "${version}" > "src-pkg/${dir}/VERSION"
          sed -i "s/^var version = \".*\"/var version = \"${version}\"/" "src-pkg/${dir}/cmd/tomovee/main.go"
          tar -C src-pkg -czf "release/${dir}.tar.gz" "${dir}"
          (cd release && sha256sum "${dir}.tar.gz" >> SHA256SUMS)

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists; skipping creation"
          else
            git tag -a "${tag}" -F release-notes.md
            git push origin "refs/tags/${tag}" \
              || echo "tag push failed — already exists from a triggered run; continuing"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh release create "${tag}" \
            --title "tomovee ${tag}" \
            --notes-file release-notes.md \
            release/tomovee-*.linux-*.tar.gz \
            release/tomovee-*-src.tar.gz \
            release/SHA256SUMS \
            CHANGELOG.md || \
          gh release upload "${tag}" \
            release/tomovee-*.linux-*.tar.gz \
            release/tomovee-*-src.tar.gz \
            release/SHA256SUMS \
            CHANGELOG.md \
            --clobber