name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.1.0). Falls back to the last tag when empty."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.1.0)"
          fi
          tag="${tag#v}"
          echo "tag=${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build documentation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends asciidoctor
          mkdir -p dist/docs/html
          asciidoctor -b html5 docs/tomovee.adoc -o dist/docs/html/usage.html
          asciidoctor -b html5 docs/api.adoc -o dist/docs/html/api.html
          cp docs/tomovee.adoc docs/api.adoc dist/docs/

      - name: Build binary
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.tag }}" \
            -o dist/tomovee ./cmd/tomovee

      - name: Stage tarball
        run: |
          tag="${{ steps.version.outputs.tag }}"
          dir="tomovee-${tag}-linux-${{ matrix.goarch }}"
          mkdir -p "dist/pkg/${dir}"
          cp dist/tomovee "dist/pkg/${dir}/tomovee"
          cp -r dist/docs "dist/pkg/${dir}/docs"
          cp README.md SPEC.md config.example.yaml "dist/pkg/${dir}/"
          tar -C dist/pkg -czf "dist/${dir}.tar.gz" "${dir}"
          sha256sum "dist/${dir}.tar.gz" \
            > "dist/SHA256SUMS-${{ matrix.goarch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomovee-${{ matrix.goarch }}
          path: |
            dist/tomovee-*.linux-*.tar.gz
            dist/SHA256SUMS-*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Combine checksums
        run: cat release/SHA256SUMS-* > release/SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          gh release create "${tag}" \
            --title "tomovee ${tag}" \
            --notes "Automated release build for linux/amd64, linux/arm64 and linux/riscv64. See docs/ and README.md for usage." \
            release/tomovee-*.linux-*.tar.gz release/SHA256SUMS || \
          gh release upload "${tag}" \
            release/tomovee-*.linux-*.tar.gz release/SHA256SUMS \
            --clobber
