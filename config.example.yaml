# Tomovee example configuration.
# Copy to ~/.config/tomovee/config.yaml (or pass --config PATH) and adjust.

# SQLite database file.
database_path: ~/.local/share/tomovee/tomovee.db

# Directory where poster images are cached.
poster_cache_dir: ~/.local/share/tomovee/posters

# HTTP listen address for `tomovee serve`.
listen: 127.0.0.1:8080

# Named media libraries scanned for files. Each entry maps a name to its root
# directory; the name identifies the library for per-library scans. Stored file
# paths are relative to each library's root. At least one library is required
# unless watch_enabled is true.
libraries:
  movies: ~/Media/Movies
  tv: ~/Media/TV

# External API credentials. All are optional; matching degrades gracefully.
api:
  tmdb_key: ""
  opensubtitles_api_key: ""
  opensubtitles_username: ""
  opensubtitles_password: ""
  opensubtitles_user_agent: "Tomovee/0.1 by Cyber Souris"

# Default for newly registered libraries' watching state, and the master switch
# for folder watching. Per-library toggles persist to the database and can be
# changed from the web UI.
watch_enabled: false

scan:
  # A file is treated as a quality variant of a sibling when the parent folder
  # holds at least this many files.
  quality_subdir_min_size: 2
  # Files smaller than this are ignored during discovery.
  min_file_size_mb: 50

# Optional path to a directory holding IMDb dataset exports (title.basics.tsv.gz
# plus optional title.akas.tsv.gz, title.episode.tsv.gz, and title.ratings.tsv.gz)
# used for offline, network-free matching. A single title.basics.tsv(.gz) file
# is also accepted.
imdb_datasets_path: ""
